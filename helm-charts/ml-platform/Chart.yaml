apiVersion: v2
name: ml-platform
description: Complete MLOps platform with Prefect orchestration, JupyterLab, MLflow tracking, and MinIO storage
type: application
version: 2.0.0
appVersion: "2.0"

dependencies:
  # Shared PostgreSQL database (deployed first)
  - name: postgresql
    version: "1.0.0"
    repository: "file://./charts/postgresql"
    condition: postgresql.enabled
  
  # MinIO object storage for artifacts (deployed second)
  - name: minio
    version: "1.0.0"
    repository: "file://./charts/minio"
    condition: minio.enabled
  
  # Prefect workflow orchestration (requires PostgreSQL)
  - name: prefect
    version: "1.0.0"
    repository: "file://./charts/prefect"
    condition: prefect.enabled
  
  # MLflow experiment tracking (requires PostgreSQL and MinIO)
  - name: mlflow
    version: "1.0.0"
    repository: "file://./charts/mlflow"
    condition: mlflow.enabled
  
  # JupyterLab development environment
  - name: jupyter
    version: "1.0.0"
    repository: "file://./charts/jupyter"
    condition: jupyter.enabled
