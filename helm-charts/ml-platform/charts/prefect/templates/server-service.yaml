apiVersion: v1
kind: Service
metadata:
  name: prefect-server
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: server
spec:
  type: {{ .Values.prefect.server.service.type }}
  ports:
  - port: {{ .Values.prefect.server.service.port }}
    targetPort: {{ .Values.prefect.server.service.targetPort }}
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: server
