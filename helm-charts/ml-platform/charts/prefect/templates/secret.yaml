apiVersion: v1
kind: Secret
metadata:
  name: prefect-db-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  {{- if .Values.postgresql.external.enabled }}
  connection-string: "postgresql+asyncpg://{{ .Values.postgresql.external.username }}:{{ .Values.postgresql.external.password }}@{{ .Values.postgresql.external.host }}:{{ .Values.postgresql.external.port }}/{{ .Values.postgresql.external.database }}"
  {{- else }}
  connection-string: "postgresql+asyncpg://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@prefect-postgresql:{{ .Values.postgresql.service.port }}/{{ .Values.postgresql.auth.database }}"
  postgres-password: {{ .Values.postgresql.auth.password | quote }}
  {{- end }}
