{{- if .Values.mlflow.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: mlflow-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  # PostgreSQL backend store connection
  backend-store-uri: "postgresql://{{ .Values.mlflow.backendStore.postgres.username }}:{{ .Values.mlflow.backendStore.postgres.password }}@{{ .Values.mlflow.backendStore.postgres.host }}:{{ .Values.mlflow.backendStore.postgres.port }}/{{ .Values.mlflow.backendStore.postgres.database }}"
  
  # S3/MinIO artifact store credentials
  {{- if .Values.mlflow.artifactStore.s3.enabled }}
  s3-access-key: {{ .Values.mlflow.artifactStore.s3.accessKeyId | quote }}
  s3-secret-key: {{ .Values.mlflow.artifactStore.s3.secretAccessKey | quote }}
  s3-endpoint: {{ .Values.mlflow.artifactStore.s3.endpointUrl | quote }}
  {{- end }}
{{- end }}
